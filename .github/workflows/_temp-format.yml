name: Temporary Deno format branch repair
on:
  push:
    branches: [fix/deno-entrypoint-2026]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.43.6
      - run: deno fmt
      - name: Commit formatted files only to this branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add --all
            git commit -m 'Apply formatter to Deno compatibility patch [skip ci]'
            git push origin HEAD:refs/heads/fix/deno-entrypoint-2026
          fi
